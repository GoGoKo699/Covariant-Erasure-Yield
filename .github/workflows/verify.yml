name: Verify science
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - run: python -m pip install -r verification/requirements.txt
      - run: python verification/run_all.py
      - run: python verification/check_structure.py
